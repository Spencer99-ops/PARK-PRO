[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/:path*"
  to = "https://park-18punfznh-park-pro.vercel.app/api/:path*"
  status = 200
  force = true
